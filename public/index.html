<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sino Na? 🍺</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060912;
      --bg-elevated: #0e1424;
      --bg-card: rgba(18, 26, 46, 0.82);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent: #f4bc3d;
      --accent-glow: rgba(244, 188, 61, 0.45);
      --accent-dim: #c99728;
      --warm: #ef6f5d;
      --warm-dim: #c94e3e;
      --text: #eef1f8;
      --text-muted: #919bb5;
      --border: rgba(58, 72, 108, 0.65);
      --success: #5ee9a0;
      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 22px;
      --tap: 52px;
      --font: "DM Sans", system-ui, -apple-system, sans-serif;
      --font-display: "Outfit", var(--font);
      --space-xs: 0.35rem;
      --space-sm: 0.65rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --app-max: 1120px;
      --content-max: 480px;
      --bubble-size: clamp(56px, 14vw, 76px);
      --bubble-active: clamp(72px, 18vw, 96px);
      --circle-size: min(92vw, 92vh, 420px);
      --shadow-card: 0 12px 40px rgba(0, 0, 0, 0.35);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100dvh;
      height: 100vh;
      font-family: var(--font);
      font-size: 16px;
      background:
        radial-gradient(ellipse 120% 80% at 50% -30%, rgba(244, 188, 61, 0.09), transparent 50%),
        radial-gradient(ellipse 80% 50% at 100% 80%, rgba(239, 111, 93, 0.07), transparent),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow: hidden;
      position: relative;
    }

    .bg-anim {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-anim::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: conic-gradient(
        from 0deg at 50% 50%,
        rgba(245, 185, 66, 0.06),
        rgba(232, 93, 74, 0.05),
        rgba(74, 120, 220, 0.04),
        rgba(245, 185, 66, 0.06)
      );
      animation: bgSpin 28s linear infinite;
    }

    @keyframes bgSpin {
      to { transform: rotate(360deg); }
    }

    .bg-dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(245, 185, 66, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      animation: dotsDrift 20s linear infinite;
      opacity: 0.35;
    }

    @keyframes dotsDrift {
      0% { background-position: 0 0; }
      100% { background-position: 28px 56px; }
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--app-max);
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding:
        calc(var(--safe-top) + var(--space-md))
        var(--space-md)
        calc(var(--safe-bottom) + var(--space-md));
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      width: 100%;
      max-width: var(--content-max);
      margin: 0 auto;
    }

    .screen--wide { max-width: 100%; }

    .screen-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding-bottom: var(--space-md);
    }

    .screen-footer {
      flex-shrink: 0;
      padding-top: var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .brand {
      text-align: center;
      margin-bottom: var(--space-lg);
      padding-top: var(--space-xs);
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      margin-bottom: var(--space-sm);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(244, 188, 61, 0.25), rgba(239, 111, 93, 0.15));
      border: 1px solid var(--glass-border);
      font-size: 1.6rem;
      box-shadow: var(--shadow-card);
    }

    .brand h1, .setup-header h1, .screen-header h1 {
      font-family: var(--font-display);
      font-size: clamp(1.85rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p, .setup-header p, .screen-header p {
      margin-top: var(--space-xs);
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 28ch;
      margin-left: auto;
      margin-right: auto;
    }

    .setup-header, .screen-header {
      text-align: center;
      margin-bottom: var(--space-lg);
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
    }

    .field-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    .field-block {
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .field-block:last-of-type { border-bottom: none; }

    .room-code-banner {
      text-align: center;
      padding: var(--space-md);
      margin-bottom: var(--space-sm);
    }

    .room-code-banner .label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .room-code-banner .code {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 6vw, 2.35rem);
      font-weight: 800;
      letter-spacing: 0.22em;
      color: var(--accent);
      margin: var(--space-xs) 0;
    }

    .role-badge {
      display: inline-flex;
      margin-top: var(--space-xs);
      padding: 0.3rem 0.7rem;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 999px;
      background: rgba(244, 188, 61, 0.12);
      color: var(--accent);
      border: 1px solid rgba(244, 188, 61, 0.25);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: var(--space-sm);
    }

    .status-pill::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-pill.offline::before {
      background: var(--warm);
      box-shadow: 0 0 8px var(--warm);
    }

    .round-bar-promo {
      width: 100%;
      text-align: center;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-weight: 800;
      padding: var(--space-md);
      margin-bottom: var(--space-sm);
      background: linear-gradient(135deg, rgba(244, 188, 61, 0.14), rgba(239, 111, 93, 0.08));
      border: 1px solid rgba(244, 188, 61, 0.28);
      border-radius: var(--radius);
    }

    .round-bar-promo .hl { color: var(--accent); }

    .tracker-layout {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      width: 100%;
      min-height: 0;
      flex: 1;
    }

    .tracker-side {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      flex-shrink: 0;
    }

    .tracker-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .tracker-toolbar .btn {
      min-height: 44px;
      font-size: 0.88rem;
    }

    .add-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--space-sm);
      margin-bottom: var(--space-sm);
    }

    .add-row input, .code-input, .text-input {
      width: 100%;
      min-height: var(--tap);
      padding: 0 var(--space-md);
      font-family: inherit;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .code-input {
      text-align: center;
      letter-spacing: 0.4em;
      font-weight: 800;
      font-family: var(--font-display);
      text-transform: uppercase;
    }

    .text-input:focus, .code-input:focus, .add-row input:focus {
      border-color: rgba(244, 188, 61, 0.6);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-height: var(--tap);
      padding: 0 var(--space-lg);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s;
      user-select: none;
      width: 100%;
    }

    .btn:hover:not(:disabled) { filter: brightness(1.05); }

    .btn:active:not(:disabled) { transform: scale(0.98); }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-accent {
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%);
      color: #1a1206;
      box-shadow: 0 6px 24px var(--accent-glow);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-skip {
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border);
      min-height: var(--tap);
      font-size: 0.92rem;
    }

    .btn-danger {
      background: rgba(239, 111, 93, 0.08);
      color: var(--warm);
      border: 1px solid rgba(239, 111, 93, 0.45);
    }

    .btn-inline {
      width: auto;
      min-width: 5.5rem;
      padding: 0 var(--space-md);
      white-space: nowrap;
    }

    .error-msg {
      color: var(--warm);
      font-size: 0.9rem;
      min-height: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      min-height: 2rem;
      margin-bottom: 1rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.6rem 0.45rem 0.8rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.9rem;
    }

    .chip.host-chip {
      border-color: var(--accent);
      background: rgba(245, 185, 66, 0.1);
    }

    .chip-remove {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
    }

    .home-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .circle-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: var(--space-xs) 0;
    }

    .circle-wrap,
    .circle-stage {
      overflow: visible;
    }

    .circle-stage {
      position: relative;
      width: var(--circle-size);
      height: var(--circle-size);
      max-width: 100%;
      flex-shrink: 0;
    }

    .circle-guide {
      position: absolute;
      inset: 10%;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      pointer-events: none;
    }

    .circle-guide::after {
      content: '';
      position: absolute;
      inset: 22%;
      border-radius: 50%;
      border: 1px solid rgba(244, 188, 61, 0.08);
    }

    .bubble-slot {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      pointer-events: none;
      z-index: 1;
      transition: left 0.45s cubic-bezier(0.4, 0, 0.2, 1), top 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bubble-slot.active { z-index: 4; }

    .bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: var(--bubble-size);
      height: var(--bubble-size);
      padding: 0.35rem;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 2px solid var(--border);
      text-align: center;
      transition: transform 0.35s ease, box-shadow 0.35s ease, opacity 0.35s ease, width 0.35s ease, height 0.35s ease;
    }

    .bubble-icon {
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      line-height: 1;
      margin-bottom: 0.15rem;
    }

    .bubble-name {
      font-size: clamp(0.62rem, 1.8vw, 0.72rem);
      font-weight: 700;
      line-height: 1.1;
      max-width: calc(var(--bubble-size) - 12px);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
    }

    .skip-badge {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.35);
      padding: 0.15rem 0.4rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .bubble-slot.active .bubble {
      width: var(--bubble-active);
      height: var(--bubble-active);
      border-color: var(--accent);
      background: linear-gradient(160deg, rgba(244, 188, 61, 0.22), rgba(239, 111, 93, 0.1));
      animation: pulseGlow 1.5s ease-in-out infinite;
    }

    .bubble-slot.active .bubble-name {
      font-size: clamp(0.7rem, 2vw, 0.82rem);
      color: var(--accent);
      max-width: calc(var(--bubble-active) - 14px);
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 var(--accent-glow), 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 8px rgba(244, 188, 61, 0.15), 0 12px 32px var(--accent-glow);
      }
    }

    .bubble-slot.done .bubble {
      opacity: 0.5;
      border-color: rgba(94, 233, 160, 0.45);
    }

    .bubble-slot.done .bubble-name { color: var(--success); }

    .bubble-slot.skipped-round .bubble {
      border-color: rgba(145, 155, 181, 0.45);
    }

    .bubble-slot.you .bubble {
      box-shadow: 0 0 0 2px rgba(244, 188, 61, 0.35);
    }

    .center-zone {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: var(--space-sm);
      z-index: 5;
      width: min(200px, 52%);
      max-width: 220px;
    }

    .center-zone .btn-shot {
      background: linear-gradient(145deg, var(--warm) 0%, var(--warm-dim) 100%);
      color: #fff;
      box-shadow: 0 8px 28px rgba(239, 111, 93, 0.45);
      font-size: clamp(0.88rem, 2.5vw, 1rem);
      line-height: 1.2;
      padding: var(--space-md) var(--space-sm);
    }

    .center-wait {
      text-align: center;
      padding: var(--space-md);
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .center-wait strong {
      color: var(--accent);
      display: block;
      margin-top: 0.2rem;
      font-size: 1rem;
    }

    .toast-ikaw {
      position: fixed;
      top: calc(var(--safe-top) + var(--space-md));
      left: 50%;
      transform: translateX(-50%) translateY(-150%);
      z-index: 300;
      padding: 0.9rem 1.75rem;
      font-family: var(--font-display);
      background: linear-gradient(135deg, var(--accent), #e8a82e);
      color: #1a1206;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 800;
      border-radius: 999px;
      box-shadow: 0 12px 48px var(--accent-glow);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      white-space: nowrap;
      max-width: calc(100vw - 2rem);
    }

    .toast-ikaw.show {
      transform: translateX(-50%) translateY(0);
    }

    .celebration {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 11, 20, 0.9);
      z-index: 100;
      padding: 1.5rem;
      overflow: hidden;
    }

    .confetti-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -10%;
      font-size: 1.25rem;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.2;
      }
    }

    .celebration-box {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem 1.5rem;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: 0 0 60px var(--accent-glow);
      max-width: 320px;
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.75); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .celebration-box h2 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }

    .host-edit {
      width: 100%;
      padding: var(--space-md);
      margin-top: var(--space-sm);
    }

    .host-edit-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: var(--space-sm);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 9, 18, 0.88);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: var(--space-md);
      animation: fadeIn 0.2s ease;
    }

    @media (min-width: 640px) {
      .modal-overlay {
        align-items: center;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 70dvh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 1.25rem;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-sheet h2 {
      font-size: 1.2rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .score-row:last-child { border-bottom: none; }

    .score-row .stats {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .score-row .stats span strong {
      color: var(--accent);
    }

    .ended-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-xl) 0;
    }

    .ended-box {
      padding: var(--space-xl) var(--space-lg);
      width: 100%;
      max-width: 360px;
    }

    .ended-box h2 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 1.85rem);
      color: var(--accent);
    }

    .empty-hint {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-style: italic;
    }

    .match-hint {
      font-size: 0.88rem;
      color: var(--success);
      margin: var(--space-sm) 0;
      padding: var(--space-sm) var(--space-md);
      background: rgba(94, 233, 160, 0.08);
      border-radius: var(--radius-sm);
      border: 1px solid rgba(94, 233, 160, 0.2);
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    /* —— Responsive: tablet —— */
    @media (min-width: 640px) {
      #app {
        padding:
          calc(var(--safe-top) + var(--space-lg))
          var(--space-lg)
          calc(var(--safe-bottom) + var(--space-lg));
      }

      :root {
        --circle-size: min(72vw, 440px);
      }

      .modal-sheet {
        border-radius: var(--radius-lg);
        max-height: 80dvh;
      }
    }

    /* —— Responsive: laptop / desktop —— */
    @media (min-width: 900px) {
      :root {
        --content-max: 100%;
        --circle-size: min(420px, 52vh);
        --bubble-size: 68px;
        --bubble-active: 92px;
      }

      #app {
        padding:
          calc(var(--safe-top) + var(--space-xl))
          var(--space-xl)
          calc(var(--safe-bottom) + var(--space-xl));
      }

      .screen:not(.screen--wide) {
        max-width: 520px;
      }

      .tracker-layout {
        display: grid;
        grid-template-columns: minmax(260px, 300px) 1fr;
        grid-template-rows: 1fr auto;
        gap: var(--space-lg);
        align-items: start;
        flex: 1;
        min-height: 0;
      }

      .tracker-side {
        grid-row: 1 / 3;
        position: sticky;
        top: 0;
      }

      .tracker-main {
        grid-column: 2;
        min-height: min(520px, 65vh);
      }

      .tracker-footer-zone {
        grid-column: 2;
        max-width: 100%;
      }

      .host-edit {
        grid-column: 1 / -1;
        max-width: 100%;
      }

      .circle-wrap {
        padding: var(--space-lg) 0;
      }

      .center-zone {
        width: min(240px, 45%);
      }

      .home-actions {
        max-width: 400px;
        margin: 0 auto;
        width: 100%;
      }
    }

    @media (min-width: 1100px) {
      :root {
        --circle-size: 460px;
      }
    }

    /* Short phones: shrink circle */
    @media (max-height: 640px) and (max-width: 899px) {
      :root {
        --circle-size: min(78vw, 72vh);
        --tap: 48px;
      }

      .brand { margin-bottom: var(--space-md); }
      .brand-mark { width: 44px; height: 44px; font-size: 1.35rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-anim::before,
      .bg-dots,
      .bubble-slot.active .bubble,
      .confetti-piece {
        animation: none !important;
      }

      .toast-ikaw,
      .bubble,
      .bubble-slot {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg-anim" aria-hidden="true">
    <div class="bg-dots"></div>
  </div>
  <div id="toast-ikaw" class="toast-ikaw" aria-live="assertive">IKAW NA! 🥃</div>
  <div id="app"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const STORAGE_KEY = 'sinoNa_session';
    const CONFETTI_EMOJIS = ['🍺', '🥃', '🎉', '✨', '🍻', '⭐'];

    const state = {
      screen: 'home',
      connected: false,
      role: null,
      code: null,
      drinkerIndex: -1,
      hostName: '',
      otherDrinkers: [],
      drinkers: [],
      round: 1,
      currentIndex: 0,
      drunkThisRound: [],
      skippedThisRound: [],
      drinkCounts: [],
      skipCounts: [],
      celebrating: false,
      playerSlots: {},
      setupError: '',
      joinError: '',
      joinCode: '',
      joinPlayerName: '',
      joinMatchedIndex: -1,
      peekDrinkers: [],
      peekTaken: [],
      status: null,
      showScoreboard: false,
      lastTurnIndex: -1,
      toastTimer: null,
    };

    const socket = io({ reconnection: true, reconnectionAttempts: Infinity });
    const $ = (sel, root = document) => root.querySelector(sel);

    function saveSession() {
      if (!state.code || !state.role) return;
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          code: state.code,
          role: state.role,
          drinkerIndex: state.drinkerIndex,
        })
      );
    }

    function clearSession() {
      localStorage.removeItem(STORAGE_KEY);
    }

    function loadSession() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      } catch {
        return null;
      }
    }

    function showIkawToast() {
      const el = $('#toast-ikaw');
      if (!el) return;
      el.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function maybeShowTurnToast(prevIndex) {
      const myIdx = state.drinkerIndex;
      if (myIdx < 0 || state.celebrating) return;
      if (
        state.currentIndex === myIdx &&
        prevIndex !== myIdx &&
        !state.drunkThisRound.includes(myIdx) &&
        !state.skippedThisRound.includes(myIdx)
      ) {
        showIkawToast();
      }
    }

    function applyServerState(s, prevIndex) {
      const prev = prevIndex ?? state.currentIndex;
      state.code = s.code;
      state.drinkers = s.drinkers || [];
      state.status = s.status;
      state.round = s.round;
      state.currentIndex = s.currentIndex;
      state.drunkThisRound = s.drunkThisRound || [];
      state.skippedThisRound = s.skippedThisRound || [];
      state.drinkCounts = s.drinkCounts || [];
      state.skipCounts = s.skipCounts || [];
      state.celebrating = s.celebrating;
      state.playerSlots = s.playerSlots || {};
      if (s.status === 'tracker') {
        state.screen = 'tracker';
        maybeShowTurnToast(prev);
      }
      if (s.status === 'ended') state.screen = 'ended';
      state.lastTurnIndex = state.currentIndex;
      render();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function normalizeName(name) {
      return name.trim().replace(/\s+/g, ' ');
    }

    function isDuplicateOther(name) {
      const n = normalizeName(name).toLowerCase();
      if (normalizeName(state.hostName).toLowerCase() === n) return true;
      return state.otherDrinkers.some((d) => d.toLowerCase() === n);
    }

    function takenIndices() {
      if (state.screen === 'join' && state.peekTaken.length) {
        return new Set(state.peekTaken);
      }
      return new Set(Object.values(state.playerSlots));
    }

    function isMyTurn() {
      return (
        state.drinkerIndex >= 0 &&
        state.drinkerIndex === state.currentIndex &&
        !state.celebrating
      );
    }

    function canSkip() {
      if (state.celebrating) return false;
      if (state.role === 'host') return true;
      return isMyTurn();
    }

    function currentDrinkerName() {
      return state.drinkers[state.currentIndex] || '';
    }

    function findJoinMatch() {
      const name = normalizeName(state.joinPlayerName);
      if (!name || !state.peekDrinkers.length) return -1;
      const n = name.toLowerCase();
      return state.peekDrinkers.findIndex((d) => d.toLowerCase() === n);
    }

    function circleRadius(count) {
      if (count <= 4) return 40;
      if (count <= 6) return 38;
      if (count <= 8) return 35;
      return 32;
    }

    function joinMatchHtml() {
      const matchIdx = findJoinMatch();
      const taken = takenIndices();
      if (!state.peekDrinkers.length || !normalizeName(state.joinPlayerName)) return '';
      if (matchIdx >= 0) {
        return taken.has(matchIdx)
          ? '<p class="error-msg">May naka-claim na sa pangalang ito.</p>'
          : `<p class="match-hint">✓ Nahanap: ${escapeHtml(state.peekDrinkers[matchIdx])}</p>`;
      }
      return '<p class="error-msg">Wala ang pangalan mo sa listahan ng host.</p>';
    }

    function updateJoinMatchArea() {
      const el = document.getElementById('join-match-area');
      const btn = document.getElementById('btn-join-confirm');
      if (!el) return;
      el.innerHTML = joinMatchHtml();
      if (btn) {
        const matchIdx = findJoinMatch();
        const taken = takenIndices();
        const canJoin =
          state.joinCode.length === 4 &&
          normalizeName(state.joinPlayerName) &&
          matchIdx >= 0 &&
          !taken.has(matchIdx) &&
          state.connected;
        btn.disabled = !canJoin;
      }
    }

    function buildConfettiHtml() {
      let html = '';
      for (let i = 0; i < 36; i++) {
        const left = Math.random() * 100;
        const delay = Math.random() * 0.8;
        const dur = 1.8 + Math.random() * 1.4;
        const emoji = CONFETTI_EMOJIS[i % CONFETTI_EMOJIS.length];
        html += `<span class="confetti-piece" style="left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s">${emoji}</span>`;
      }
      return html;
    }

    socket.on('connect', () => {
      state.connected = true;
      const saved = loadSession();
      if (saved?.code) {
        socket.emit('room:rejoin', saved, (res) => {
          if (res?.ok) {
            state.role = res.role;
            state.drinkerIndex = res.drinkerIndex;
            applyServerState(res.state);
            saveSession();
          } else {
            clearSession();
            render();
          }
        });
      } else {
        render();
      }
    });

    socket.on('disconnect', () => {
      state.connected = false;
      render();
    });

    socket.on('room:state', (s) => {
      applyServerState(s, state.currentIndex);
    });

    socket.on('session:ended', () => {
      state.screen = 'ended';
      state.status = 'ended';
      clearSession();
      render();
    });

    socket.on('room:kicked', (payload) => {
      clearSession();
      state.screen = 'home';
      state.role = null;
      state.code = null;
      state.joinError = payload?.reason || 'Naalis ka sa grupo.';
      render();
    });

    function renderHome() {
      return `
        <div class="screen">
          <div class="screen-body">
            <header class="brand">
              <div class="brand-mark">🍺</div>
              <h1>Sino Na?</h1>
              <p>Real-time inuman tracker para sa barkada</p>
            </header>
            <p class="status-pill ${state.connected ? '' : 'offline'}" style="justify-content:center;width:100%">
              ${state.connected ? 'Handa na ang server' : 'Kumokonekta...'}
            </p>
            <div class="home-actions">
              <button type="button" class="btn btn-accent" id="btn-host">Gumawa ng inuman</button>
              <button type="button" class="btn btn-ghost" id="btn-join-nav">Sumali sa room code</button>
            </div>
            ${state.joinError ? `<p class="error-msg" style="margin-top:var(--space-md)">${escapeHtml(state.joinError)}</p>` : ''}
          </div>
        </div>`;
    }

    function renderSetup() {
      const host = normalizeName(state.hostName);
      const canStart = host && state.otherDrinkers.length >= 1 && state.connected;
      const chips = state.otherDrinkers.length
        ? state.otherDrinkers
            .map(
              (name, i) => `
          <span class="chip" data-index="${i}">
            ${escapeHtml(name)}
            <button type="button" class="chip-remove">✕</button>
          </span>`
            )
            .join('')
        : '<span class="empty-hint">Mag-add ng iba pang kasama</span>';

      return `
        <div class="screen">
          <div class="screen-body">
            <header class="setup-header">
              <h1>I-setup ang inuman</h1>
              <p>Ikaw ang host — idagdag ang mga kasama</p>
            </header>
            <div class="form-stack">
              <div class="form-group card" style="padding:var(--space-md)">
                <p class="field-label">Pangalan mo?</p>
                <input type="text" class="text-input" id="host-name-input" placeholder="Ikaw (host)..."
                  value="${escapeHtml(state.hostName)}" maxlength="32" autocomplete="name" />
              </div>
              <div class="form-group card" style="padding:var(--space-md)">
                <p class="field-label">Iba pang kasama</p>
                <div class="add-row">
                  <input type="text" id="name-input" placeholder="Pangalan..." maxlength="32" autocomplete="off" />
                  <button type="button" class="btn btn-accent btn-inline" id="btn-add">Add</button>
                </div>
                <div class="chip-list">${chips}</div>
              </div>
            </div>
            <p class="error-msg">${escapeHtml(state.setupError)}</p>
          </div>
          <footer class="screen-footer">
            <button type="button" class="btn btn-accent" id="btn-start" ${canStart ? '' : 'disabled'}>
              Simulan na!
            </button>
            <button type="button" class="btn btn-ghost" id="btn-back-home">Bumalik</button>
          </footer>
        </div>`;
    }

    function renderJoin() {
      const matchIdx = findJoinMatch();
      const taken = takenIndices();
      const canJoin =
        state.joinCode.length === 4 &&
        normalizeName(state.joinPlayerName) &&
        matchIdx >= 0 &&
        !taken.has(matchIdx) &&
        state.connected;

      return `
        <div class="screen">
          <div class="screen-body">
            <header class="screen-header">
              <h1>Sumali sa inuman</h1>
              <p>Room code at pangalan — dapat nasa listahan ng host</p>
            </header>
            <div class="form-stack">
              <div class="form-group card" style="padding:var(--space-md)">
                <p class="field-label">Room code</p>
                <input type="text" class="code-input" id="join-code" maxlength="4" inputmode="text"
                  placeholder="B7KQ" value="${escapeHtml(state.joinCode)}" autocomplete="off" />
                <button type="button" class="btn btn-ghost" id="btn-peek" style="margin-top:var(--space-sm)">Hanapin ang room</button>
              </div>
              <div class="form-group card" style="padding:var(--space-md)">
                <p class="field-label">Pangalan mo?</p>
                <input type="text" class="text-input" id="join-name" placeholder="Tulad ng binigay ng host..."
                  value="${escapeHtml(state.joinPlayerName)}" maxlength="32" autocomplete="name" />
                <div id="join-match-area">${joinMatchHtml()}</div>
              </div>
            </div>
            <p class="error-msg">${escapeHtml(state.joinError)}</p>
          </div>
          <footer class="screen-footer">
            <button type="button" class="btn btn-accent" id="btn-join-confirm" ${canJoin ? '' : 'disabled'}>
              Sumali na!
            </button>
            <button type="button" class="btn btn-ghost" id="btn-back-home">Bumalik</button>
          </footer>
        </div>`;
    }

    function renderScoreboardModal() {
      if (!state.showScoreboard) return '';
      const rows = state.drinkers
        .map((name, i) => {
          const drinks = state.drinkCounts[i] || 0;
          const skips = state.skipCounts[i] || 0;
          const you =
            state.drinkerIndex === i
              ? ' <span style="color:var(--accent)">(ikaw)</span>'
              : '';
          return `
          <div class="score-row">
            <span>${escapeHtml(name)}${you}</span>
            <div class="stats">
              <span>🥃 <strong>${drinks}</strong></span>
              <span>⏭️ <strong>${skips}</strong></span>
            </div>
          </div>`;
        })
        .join('');

      return `
        <div class="modal-overlay" id="modal-score">
          <div class="modal-sheet">
            <h2>📊 Scoreboard</h2>
            <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1rem">
              Kabuuang inom at skip ng session
            </p>
            ${rows}
            <button type="button" class="btn btn-ghost" id="btn-close-score" style="margin-top:var(--space-md)">Isara</button>
          </div>
        </div>`;
    }

    function renderTracker() {
      const total = state.drinkers.length;
      const done = state.drunkThisRound.length;
      const radius = circleRadius(total);

      const slots = state.drinkers
        .map((name, i) => {
          const angle = (i / total) * 360 - 90;
          const rad = (angle * Math.PI) / 180;
          const x = 50 + radius * Math.cos(rad);
          const y = 50 + radius * Math.sin(rad);
          const isActive = i === state.currentIndex && !state.celebrating;
          const isDone = state.drunkThisRound.includes(i);
          const isSkipped = state.skippedThisRound.includes(i);
          const isYou = state.drinkerIndex === i;
          const skips = state.skipCounts[i] || 0;

          let icon = '';
          if (isActive) icon = '🥃';
          else if (isDone) icon = '✓';
          else if (isSkipped) icon = '⏭️';

          const classes = [
            'bubble-slot',
            isActive ? 'active' : '',
            isDone ? 'done' : '',
            isSkipped && !isDone ? 'skipped-round' : '',
            isYou ? 'you' : '',
          ]
            .filter(Boolean)
            .join(' ');

          const skipBadge =
            skips > 0
              ? `<span class="skip-badge">skip x${skips}</span>`
              : '';

          return `
            <div class="${classes}" style="left:${x}%;top:${y}%">
              <div class="bubble">
                <span class="bubble-icon">${icon}</span>
                <span class="bubble-name">${escapeHtml(name)}</span>
              </div>
              ${skipBadge}
            </div>`;
        })
        .join('');

      let centerActions = '';
      if (isMyTurn()) {
        centerActions = `
          <button type="button" class="btn btn-shot" id="btn-shot">Ininom ko na! 🥃</button>
          <button type="button" class="btn btn-skip" id="btn-skip">Preskong muna ⏭️</button>`;
      } else if (state.role === 'host' && canSkip()) {
        centerActions = `
          <div class="center-wait">
            Turno ni <strong>${escapeHtml(currentDrinkerName())}</strong>
          </div>
          <button type="button" class="btn btn-skip" id="btn-skip">Preskong muna ⏭️</button>`;
      } else {
        const msg = state.celebrating
          ? 'Next round na...'
          : `Hintay — si ${escapeHtml(currentDrinkerName())}`;
        centerActions = `<div class="center-wait">${escapeHtml(msg)}</div>`;
      }

      const hostEdit =
        state.role === 'host'
          ? `
        <section class="host-edit card">
          <p class="host-edit-title">Host: dagdag o alis ng kasama (hindi ikaw)</p>
          <div class="add-row">
            <input type="text" id="host-add-input" placeholder="Magdagdag..." maxlength="32" />
            <button type="button" class="btn btn-accent btn-inline" id="btn-host-add">Add</button>
          </div>
          <div class="chip-list">
            ${state.drinkers
              .map((name, i) => {
                if (i === 0) {
                  return `<span class="chip host-chip">${escapeHtml(name)} (ikaw)</span>`;
                }
                return `
              <span class="chip" data-index="${i}">
                ${escapeHtml(name)}
                <button type="button" class="chip-remove" ${state.drinkers.length <= 2 ? 'disabled' : ''}>✕</button>
              </span>`;
              })
              .join('')}
          </div>
        </section>`
          : '';

      const celebration = state.celebrating
        ? `<div class="celebration">
            <div class="confetti-layer">${buildConfettiHtml()}</div>
            <div class="celebration-box">
              <h2>Lahat tapos na round! 🎉</h2>
              <p style="color:var(--text-muted)">Next round na...</p>
            </div>
          </div>`
        : '';

      return `
        <div class="screen screen--wide">
          <div class="screen-body">
            <div class="tracker-layout">
              <aside class="tracker-side">
                <div class="room-code-banner card">
                  <div class="label">Room code — i-share</div>
                  <div class="code">${escapeHtml(state.code || '')}</div>
                  ${state.role === 'host' ? '<span class="role-badge">Host · nasa bilog</span>' : '<span class="role-badge">Player</span>'}
                </div>
                <p class="status-pill ${state.connected ? '' : 'offline'}">
                  ${state.connected ? 'Live sync' : 'Nagre-reconnect...'}
                </p>
                <p class="round-bar-promo card">
                  🍺 <span class="hl">Round ${state.round}</span> · ${done}/${total} nakainom na
                </p>
                <div class="tracker-toolbar">
                  <button type="button" class="btn btn-ghost" id="btn-scoreboard">📊 Scoreboard</button>
                </div>
              </aside>
              <main class="tracker-main">
                <div class="circle-wrap">
                  <div class="circle-stage">
                    <div class="circle-guide"></div>
                    ${slots}
                    <div class="center-zone">${centerActions}</div>
                  </div>
                </div>
              </main>
              ${hostEdit}
              <div class="tracker-footer-zone screen-footer" style="padding-top:0">
                ${
                  state.role === 'host'
                    ? `<button type="button" class="btn btn-danger" id="btn-end">Tapusin ang inuman</button>
                       <button type="button" class="btn btn-ghost" id="btn-leave-host">Umalis</button>`
                    : `<button type="button" class="btn btn-ghost" id="btn-leave-player">Umalis sa room</button>`
                }
              </div>
            </div>
          </div>
          ${celebration}
        </div>
        ${renderScoreboardModal()}`;
    }

    function renderEnded() {
      return `
        <div class="screen">
          <div class="screen-body ended-screen">
            <div class="ended-box card">
              <div class="brand-mark" style="margin:0 auto var(--space-md)">👋</div>
              <h2>Tapos na ang inuman</h2>
              <p style="color:var(--text-muted);margin-top:var(--space-sm)">Salamat sa pag-inom responsibly!</p>
            </div>
          </div>
          <footer class="screen-footer">
            <button type="button" class="btn btn-accent" id="btn-home-ended">Bumalik sa home</button>
          </footer>
        </div>`;
    }

    function bindHome() {
      $('#btn-host')?.addEventListener('click', () => {
        state.screen = 'setup';
        state.joinError = '';
        render();
      });
      $('#btn-join-nav')?.addEventListener('click', () => {
        state.screen = 'join';
        state.joinError = '';
        state.joinCode = '';
        state.joinPlayerName = '';
        state.peekDrinkers = [];
        state.peekTaken = [];
        render();
      });
    }

    function bindSetup() {
      $('#host-name-input')?.addEventListener('input', (e) => {
        state.hostName = e.target.value;
      });

      const input = $('#name-input');
      const add = () => {
        const name = normalizeName(input?.value || '');
        if (!name) {
          state.setupError = 'Maglagay ng pangalan.';
          render();
          return;
        }
        if (!normalizeName(state.hostName)) {
          state.setupError = 'Ilagay muna ang pangalan mo.';
          render();
          return;
        }
        if (isDuplicateOther(name)) {
          state.setupError = 'May ganyan na sa listahan.';
          render();
          return;
        }
        state.setupError = '';
        state.otherDrinkers.push(name);
        input.value = '';
        render();
        input?.focus();
      };

      $('#btn-add')?.addEventListener('click', add);
      input?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') add();
      });

      $('#btn-start')?.addEventListener('click', () => {
        const host = normalizeName(state.hostName);
        if (!host || state.otherDrinkers.length < 1) return;
        socket.emit(
          'room:create',
          { hostName: host, drinkers: state.otherDrinkers },
          (res) => {
            if (!res?.ok) {
              state.setupError = res?.error || 'Hindi masimulan ang room.';
              render();
              return;
            }
            state.role = 'host';
            state.drinkerIndex = 0;
            applyServerState(res.state);
            saveSession();
          }
        );
      });

      document.querySelectorAll('.chip-remove').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const chip = e.target.closest('.chip');
          const index = Number(chip?.dataset.index);
          if (!Number.isNaN(index)) {
            state.otherDrinkers.splice(index, 1);
            state.setupError = '';
            render();
          }
        });
      });

      $('#btn-back-home')?.addEventListener('click', goHome);
    }

    function bindJoin() {
      $('#join-code')?.addEventListener('input', (e) => {
        state.joinCode = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
        e.target.value = state.joinCode;
      });

      $('#join-name')?.addEventListener('input', (e) => {
        state.joinPlayerName = e.target.value;
        updateJoinMatchArea();
      });

      $('#btn-peek')?.addEventListener('click', () => {
        state.joinError = '';
        socket.emit('room:peek', { code: state.joinCode }, (res) => {
          if (!res?.ok) {
            state.joinError = res?.error || 'Hindi mahanap ang room.';
            state.peekDrinkers = [];
            render();
            return;
          }
          state.peekDrinkers = res.drinkers;
          state.peekTaken = res.takenIndices || [];
          render();
        });
      });

      $('#btn-join-confirm')?.addEventListener('click', () => {
        const idx = findJoinMatch();
        socket.emit(
          'room:join',
          {
            code: state.joinCode,
            playerName: state.joinPlayerName,
            drinkerIndex: idx,
          },
          (res) => {
            if (!res?.ok) {
              state.joinError = res?.error || 'Hindi makasali.';
              render();
              return;
            }
            state.role = 'player';
            state.drinkerIndex = res.drinkerIndex;
            state.joinError = '';
            applyServerState(res.state);
            saveSession();
          }
        );
      });

      $('#btn-back-home')?.addEventListener('click', goHome);
    }

    function bindTracker() {
      $('#btn-shot')?.addEventListener('click', () => {
        socket.emit('shot:mark', {}, () => {});
      });

      $('#btn-skip')?.addEventListener('click', () => {
        socket.emit('shot:skip', {}, () => {});
      });

      $('#btn-scoreboard')?.addEventListener('click', () => {
        state.showScoreboard = true;
        render();
      });

      $('#btn-close-score')?.addEventListener('click', () => {
        state.showScoreboard = false;
        render();
      });

      $('#modal-score')?.addEventListener('click', (e) => {
        if (e.target.id === 'modal-score') {
          state.showScoreboard = false;
          render();
        }
      });

      $('#btn-end')?.addEventListener('click', () => {
        if (!confirm('Tapusin na ang inuman para sa lahat?')) return;
        socket.emit('session:end', {}, () => {
          state.screen = 'ended';
          clearSession();
          render();
        });
      });

      $('#btn-leave-host')?.addEventListener('click', () => {
        if (confirm('Tapusin ang session para sa lahat?')) {
          socket.emit('session:end', {}, goHome);
        }
      });

      $('#btn-leave-player')?.addEventListener('click', goHome);

      if (state.role === 'host') {
        const hostInput = $('#host-add-input');
        $('#btn-host-add')?.addEventListener('click', () => {
          socket.emit('drinkers:add', { name: hostInput?.value }, (res) => {
            if (!res?.ok) state.setupError = res?.error || 'Error';
            else {
              state.setupError = '';
              hostInput.value = '';
            }
            render();
          });
        });

        document.querySelectorAll('.host-edit .chip-remove').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            const index = Number(e.target.closest('.chip')?.dataset.index);
            if (!Number.isNaN(index)) {
              socket.emit('drinkers:remove', { index }, (res) => {
                if (!res?.ok) state.setupError = res?.error || 'Error';
                render();
              });
            }
          });
        });
      }
    }

    function bindEnded() {
      $('#btn-home-ended')?.addEventListener('click', goHome);
    }

    function goHome() {
      clearSession();
      state.screen = 'home';
      state.role = null;
      state.code = null;
      state.drinkerIndex = -1;
      state.hostName = '';
      state.otherDrinkers = [];
      state.drinkers = [];
      state.drunkThisRound = [];
      state.skippedThisRound = [];
      state.celebrating = false;
      state.showScoreboard = false;
      state.peekDrinkers = [];
      state.joinCode = '';
      state.joinPlayerName = '';
      render();
    }

    function render() {
      const app = $('#app');
      let html = '';
      switch (state.screen) {
        case 'setup':
          html = renderSetup();
          break;
        case 'join':
          html = renderJoin();
          break;
        case 'tracker':
          html = renderTracker();
          break;
        case 'ended':
          html = renderEnded();
          break;
        default:
          html = renderHome();
      }
      app.innerHTML = html;

      switch (state.screen) {
        case 'home':
          bindHome();
          break;
        case 'setup':
          bindSetup();
          break;
        case 'join':
          bindJoin();
          break;
        case 'tracker':
          bindTracker();
          break;
        case 'ended':
          bindEnded();
          break;
      }
    }

    render();
  </script>
</body>
</html>
