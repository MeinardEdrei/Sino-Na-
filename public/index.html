<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sino Na? 🍺</title>
  <style>
    :root {
      --bg: #070b14;
      --bg-card: #12182a;
      --accent: #f5b942;
      --accent-glow: rgba(245, 185, 66, 0.55);
      --accent-dim: #c4922e;
      --warm: #e85d4a;
      --text: #f0f2f8;
      --text-muted: #8b95ad;
      --border: #2a3550;
      --success: #4ade80;
      --radius: 14px;
      --tap: 56px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100dvh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      overflow-x: hidden;
      position: relative;
    }

    .bg-anim {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-anim::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: conic-gradient(
        from 0deg at 50% 50%,
        rgba(245, 185, 66, 0.06),
        rgba(232, 93, 74, 0.05),
        rgba(74, 120, 220, 0.04),
        rgba(245, 185, 66, 0.06)
      );
      animation: bgSpin 28s linear infinite;
    }

    @keyframes bgSpin {
      to { transform: rotate(360deg); }
    }

    .bg-dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(245, 185, 66, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      animation: dotsDrift 20s linear infinite;
      opacity: 0.35;
    }

    @keyframes dotsDrift {
      0% { background-position: 0 0; }
      100% { background-position: 28px 56px; }
    }

    #app {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(1rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
    }

    .setup-header, .screen-header {
      text-align: center;
      margin-bottom: 1.25rem;
      padding-top: 0.25rem;
    }

    .setup-header h1, .screen-header h1 {
      font-size: clamp(2rem, 8vw, 2.75rem);
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
    }

    .setup-header p, .screen-header p {
      margin-top: 0.4rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .field-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }

    .field-block {
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .field-block:last-of-type { border-bottom: none; }

    .room-code-banner {
      text-align: center;
      margin-bottom: 0.75rem;
      padding: 0.85rem 1rem;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: 0 0 24px var(--accent-glow);
    }

    .room-code-banner .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .room-code-banner .code {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      color: var(--accent);
    }

    .role-badge {
      display: inline-block;
      margin-top: 0.35rem;
      padding: 0.2rem 0.55rem;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 999px;
      background: rgba(245, 185, 66, 0.15);
      color: var(--accent);
    }

    .conn-status {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .conn-status.offline { color: var(--warm); }

    .round-bar-promo {
      width: 100%;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, rgba(245, 185, 66, 0.18), rgba(232, 93, 74, 0.1));
      border: 1px solid rgba(245, 185, 66, 0.35);
      border-radius: var(--radius);
      color: var(--text);
    }

    .round-bar-promo .hl { color: var(--accent); }

    .tracker-toolbar {
      width: 100%;
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .tracker-toolbar .btn { flex: 1; min-height: 44px; font-size: 0.85rem; }

    .add-row {
      display: flex;
      gap: 0.65rem;
      margin-bottom: 0.75rem;
    }

    .add-row input, .code-input, .text-input {
      flex: 1;
      width: 100%;
      min-height: var(--tap);
      padding: 0 1rem;
      font-size: 1.05rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .code-input {
      text-align: center;
      letter-spacing: 0.35em;
      font-weight: 800;
      text-transform: uppercase;
    }

    .text-input:focus, .code-input:focus, .add-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap);
      padding: 0 1.25rem;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, opacity 0.2s;
      user-select: none;
      width: 100%;
    }

    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-accent {
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%);
      color: #1a1208;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 2px solid var(--border);
    }

    .btn-skip {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 2px solid var(--border);
      min-height: 48px;
      font-size: 0.9rem;
    }

    .btn-danger {
      background: transparent;
      color: var(--warm);
      border: 2px solid var(--warm);
      margin-top: 0.5rem;
    }

    .error-msg {
      color: var(--warm);
      font-size: 0.9rem;
      min-height: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      min-height: 2rem;
      margin-bottom: 1rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.6rem 0.45rem 0.8rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.9rem;
    }

    .chip.host-chip {
      border-color: var(--accent);
      background: rgba(245, 185, 66, 0.1);
    }

    .chip-remove {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
    }

    .setup-footer, .tracker-footer, .home-actions {
      margin-top: auto;
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .tracker-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .circle-stage {
      position: relative;
      width: min(360px, 94vw);
      aspect-ratio: 1;
      flex-shrink: 0;
      margin: 0.25rem 0 0.75rem;
    }

    .circle-guide {
      position: absolute;
      inset: 8%;
      border: 1px dashed rgba(42, 53, 80, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }

    .bubble-slot {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      pointer-events: none;
      transition: left 0.4s ease, top 0.4s ease;
    }

    .bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      max-width: 88px;
      min-height: 64px;
      padding: 0.4rem 0.5rem;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--border);
      text-align: center;
      transition: transform 0.35s ease, box-shadow 0.35s ease, opacity 0.35s ease, border-color 0.35s ease;
    }

    .bubble-icon {
      font-size: 0.85rem;
      line-height: 1;
      margin-bottom: 0.1rem;
      min-height: 1rem;
    }

    .bubble-name {
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1.15;
      max-width: 76px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      color: var(--text);
    }

    .skip-badge {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 0.1rem 0.35rem;
      border-radius: 6px;
    }

    .bubble-slot.active .bubble {
      min-width: 88px;
      min-height: 88px;
      max-width: 100px;
      border-color: var(--accent);
      background: rgba(245, 185, 66, 0.15);
      box-shadow: 0 0 24px var(--accent-glow), 0 0 48px rgba(245, 185, 66, 0.2);
      animation: pulseGlow 1.4s ease-in-out infinite;
      z-index: 3;
    }

    .bubble-slot.active .bubble-name {
      font-size: 0.78rem;
      color: var(--accent);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px var(--accent-glow); }
      50% { transform: scale(1.06); box-shadow: 0 0 36px var(--accent-glow), 0 0 60px rgba(245, 185, 66, 0.25); }
    }

    .bubble-slot.done .bubble {
      opacity: 0.55;
      border-color: var(--success);
    }

    .bubble-slot.done .bubble-name { color: var(--success); }

    .bubble-slot.skipped-round .bubble {
      border-color: rgba(139, 149, 173, 0.5);
    }

    .bubble-slot.you .bubble {
      outline: 2px dashed rgba(245, 185, 66, 0.45);
      outline-offset: 2px;
    }

    .center-zone {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      z-index: 5;
      width: min(240px, 78vw);
    }

    .center-zone .btn-shot {
      width: 100%;
      min-height: var(--tap);
      border-radius: var(--radius);
      font-size: 1rem;
      background: linear-gradient(145deg, var(--warm) 0%, #c43d2e 100%);
      color: #fff;
      box-shadow: 0 6px 28px rgba(232, 93, 74, 0.4);
    }

    .center-wait {
      text-align: center;
      padding: 1rem;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
      color: var(--text-muted);
      width: 100%;
    }

    .center-wait strong { color: var(--accent); display: block; margin-top: 0.25rem; }

    .toast-ikaw {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      z-index: 200;
      padding: 0.85rem 1.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: #1a1208;
      font-size: 1.35rem;
      font-weight: 900;
      border-radius: 999px;
      box-shadow: 0 8px 40px var(--accent-glow);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      white-space: nowrap;
    }

    .toast-ikaw.show {
      transform: translateX(-50%) translateY(0);
    }

    .celebration {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 11, 20, 0.9);
      z-index: 100;
      padding: 1.5rem;
      overflow: hidden;
    }

    .confetti-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -10%;
      font-size: 1.25rem;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.2;
      }
    }

    .celebration-box {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem 1.5rem;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: 0 0 60px var(--accent-glow);
      max-width: 320px;
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.75); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .celebration-box h2 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 11, 20, 0.85);
      z-index: 150;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 70dvh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 1.25rem;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-sheet h2 {
      font-size: 1.2rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .score-row:last-child { border-bottom: none; }

    .score-row .stats {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .score-row .stats span strong {
      color: var(--accent);
    }

    .ended-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .ended-box {
      padding: 2rem 1.5rem;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      max-width: 320px;
    }

    .ended-box h2 { font-size: 1.6rem; color: var(--accent); }

    .host-edit {
      width: 100%;
      margin-bottom: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .empty-hint {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-style: italic;
    }

    .match-hint {
      font-size: 0.85rem;
      color: var(--success);
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <div class="bg-anim" aria-hidden="true">
    <div class="bg-dots"></div>
  </div>
  <div id="toast-ikaw" class="toast-ikaw" aria-live="assertive">IKAW NA! 🥃</div>
  <div id="app"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const STORAGE_KEY = 'sinoNa_session';
    const CONFETTI_EMOJIS = ['🍺', '🥃', '🎉', '✨', '🍻', '⭐'];

    const state = {
      screen: 'home',
      connected: false,
      role: null,
      code: null,
      drinkerIndex: -1,
      hostName: '',
      otherDrinkers: [],
      drinkers: [],
      round: 1,
      currentIndex: 0,
      drunkThisRound: [],
      skippedThisRound: [],
      drinkCounts: [],
      skipCounts: [],
      celebrating: false,
      playerSlots: {},
      setupError: '',
      joinError: '',
      joinCode: '',
      joinPlayerName: '',
      joinMatchedIndex: -1,
      peekDrinkers: [],
      peekTaken: [],
      status: null,
      showScoreboard: false,
      lastTurnIndex: -1,
      toastTimer: null,
    };

    const socket = io({ reconnection: true, reconnectionAttempts: Infinity });
    const $ = (sel, root = document) => root.querySelector(sel);

    function saveSession() {
      if (!state.code || !state.role) return;
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          code: state.code,
          role: state.role,
          drinkerIndex: state.drinkerIndex,
        })
      );
    }

    function clearSession() {
      localStorage.removeItem(STORAGE_KEY);
    }

    function loadSession() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      } catch {
        return null;
      }
    }

    function showIkawToast() {
      const el = $('#toast-ikaw');
      if (!el) return;
      el.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function maybeShowTurnToast(prevIndex) {
      const myIdx = state.drinkerIndex;
      if (myIdx < 0 || state.celebrating) return;
      if (
        state.currentIndex === myIdx &&
        prevIndex !== myIdx &&
        !state.drunkThisRound.includes(myIdx) &&
        !state.skippedThisRound.includes(myIdx)
      ) {
        showIkawToast();
      }
    }

    function applyServerState(s, prevIndex) {
      const prev = prevIndex ?? state.currentIndex;
      state.code = s.code;
      state.drinkers = s.drinkers || [];
      state.status = s.status;
      state.round = s.round;
      state.currentIndex = s.currentIndex;
      state.drunkThisRound = s.drunkThisRound || [];
      state.skippedThisRound = s.skippedThisRound || [];
      state.drinkCounts = s.drinkCounts || [];
      state.skipCounts = s.skipCounts || [];
      state.celebrating = s.celebrating;
      state.playerSlots = s.playerSlots || {};
      if (s.status === 'tracker') {
        state.screen = 'tracker';
        maybeShowTurnToast(prev);
      }
      if (s.status === 'ended') state.screen = 'ended';
      state.lastTurnIndex = state.currentIndex;
      render();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function normalizeName(name) {
      return name.trim().replace(/\s+/g, ' ');
    }

    function isDuplicateOther(name) {
      const n = normalizeName(name).toLowerCase();
      if (normalizeName(state.hostName).toLowerCase() === n) return true;
      return state.otherDrinkers.some((d) => d.toLowerCase() === n);
    }

    function takenIndices() {
      if (state.screen === 'join' && state.peekTaken.length) {
        return new Set(state.peekTaken);
      }
      return new Set(Object.values(state.playerSlots));
    }

    function isMyTurn() {
      return (
        state.drinkerIndex >= 0 &&
        state.drinkerIndex === state.currentIndex &&
        !state.celebrating
      );
    }

    function canSkip() {
      if (state.celebrating) return false;
      if (state.role === 'host') return true;
      return isMyTurn();
    }

    function currentDrinkerName() {
      return state.drinkers[state.currentIndex] || '';
    }

    function findJoinMatch() {
      const name = normalizeName(state.joinPlayerName);
      if (!name || !state.peekDrinkers.length) return -1;
      const n = name.toLowerCase();
      return state.peekDrinkers.findIndex((d) => d.toLowerCase() === n);
    }

    function buildConfettiHtml() {
      let html = '';
      for (let i = 0; i < 36; i++) {
        const left = Math.random() * 100;
        const delay = Math.random() * 0.8;
        const dur = 1.8 + Math.random() * 1.4;
        const emoji = CONFETTI_EMOJIS[i % CONFETTI_EMOJIS.length];
        html += `<span class="confetti-piece" style="left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s">${emoji}</span>`;
      }
      return html;
    }

    socket.on('connect', () => {
      state.connected = true;
      const saved = loadSession();
      if (saved?.code) {
        socket.emit('room:rejoin', saved, (res) => {
          if (res?.ok) {
            state.role = res.role;
            state.drinkerIndex = res.drinkerIndex;
            applyServerState(res.state);
            saveSession();
          } else {
            clearSession();
            render();
          }
        });
      } else {
        render();
      }
    });

    socket.on('disconnect', () => {
      state.connected = false;
      render();
    });

    socket.on('room:state', (s) => {
      applyServerState(s, state.currentIndex);
    });

    socket.on('session:ended', () => {
      state.screen = 'ended';
      state.status = 'ended';
      clearSession();
      render();
    });

    socket.on('room:kicked', (payload) => {
      clearSession();
      state.screen = 'home';
      state.role = null;
      state.code = null;
      state.joinError = payload?.reason || 'Naalis ka sa grupo.';
      render();
    });

    function renderHome() {
      return `
        <header class="setup-header">
          <h1>Sino Na? 🍺</h1>
          <p>Real-time inuman tracker</p>
        </header>
        <p class="conn-status ${state.connected ? '' : 'offline'}">
          ${state.connected ? 'Nakakonekta sa server' : 'Kumokonekta...'}
        </p>
        <div class="home-actions">
          <button type="button" class="btn btn-accent" id="btn-host">Gumawa ng inuman (Host)</button>
          <button type="button" class="btn btn-ghost" id="btn-join-nav">Sumali sa code</button>
        </div>
        ${state.joinError ? `<p class="error-msg" style="margin-top:1rem">${escapeHtml(state.joinError)}</p>` : ''}`;
    }

    function renderSetup() {
      const host = normalizeName(state.hostName);
      const canStart = host && state.otherDrinkers.length >= 1 && state.connected;
      const chips = state.otherDrinkers.length
        ? state.otherDrinkers
            .map(
              (name, i) => `
          <span class="chip" data-index="${i}">
            ${escapeHtml(name)}
            <button type="button" class="chip-remove">✕</button>
          </span>`
            )
            .join('')
        : '<span class="empty-hint">Mag-add ng iba pang kasama</span>';

      return `
        <header class="setup-header">
          <h1>Sino Na? 🍺</h1>
          <p>I-setup ang inuman</p>
        </header>
        <section class="field-block">
          <p class="field-label">Pangalan mo?</p>
          <input type="text" class="text-input" id="host-name-input" placeholder="Ikaw (host)..."
            value="${escapeHtml(state.hostName)}" maxlength="32" autocomplete="name" />
        </section>
        <section class="field-block">
          <p class="field-label">Iba pang kasama</p>
          <div class="add-row">
            <input type="text" id="name-input" placeholder="Pangalan..." maxlength="32" autocomplete="off" />
            <button type="button" class="btn btn-accent" id="btn-add" style="width:auto">Add</button>
          </div>
          <div class="chip-list">${chips}</div>
        </section>
        <p class="error-msg">${escapeHtml(state.setupError)}</p>
        <footer class="setup-footer">
          <button type="button" class="btn btn-accent" id="btn-start" ${canStart ? '' : 'disabled'}>
            Simulan na!
          </button>
          <button type="button" class="btn btn-ghost" id="btn-back-home">Bumalik</button>
        </footer>`;
    }

    function renderJoin() {
      const matchIdx = findJoinMatch();
      const taken = takenIndices();
      const canJoin =
        state.joinCode.length === 4 &&
        normalizeName(state.joinPlayerName) &&
        matchIdx >= 0 &&
        !taken.has(matchIdx) &&
        state.connected;

      let matchMsg = '';
      if (state.peekDrinkers.length && normalizeName(state.joinPlayerName)) {
        if (matchIdx >= 0) {
          matchMsg = taken.has(matchIdx)
            ? '<p class="error-msg">May naka-claim na sa pangalang ito.</p>'
            : `<p class="match-hint">✓ Nahanap: ${escapeHtml(state.peekDrinkers[matchIdx])}</p>`;
        } else {
          matchMsg = '<p class="error-msg">Wala ang pangalan mo sa listahan ng host.</p>';
        }
      }

      return `
        <header class="screen-header">
          <h1>Sumali</h1>
          <p>Ilagay ang room code at pangalan mo</p>
        </header>
        <p class="field-label">Room code</p>
        <input type="text" class="code-input" id="join-code" maxlength="4"
          placeholder="B7KQ" value="${escapeHtml(state.joinCode)}" autocomplete="off" />
        <button type="button" class="btn btn-ghost" id="btn-peek" style="margin:0.75rem 0">Hanapin ang room</button>
        <p class="field-label">Pangalan mo?</p>
        <input type="text" class="text-input" id="join-name" placeholder="Dapat nasa listahan ng host..."
          value="${escapeHtml(state.joinPlayerName)}" maxlength="32" autocomplete="name" />
        ${matchMsg}
        <p class="error-msg">${escapeHtml(state.joinError)}</p>
        <footer class="setup-footer">
          <button type="button" class="btn btn-accent" id="btn-join-confirm" ${canJoin ? '' : 'disabled'}>
            Sumali na!
          </button>
          <button type="button" class="btn btn-ghost" id="btn-back-home">Bumalik</button>
        </footer>`;
    }

    function renderScoreboardModal() {
      if (!state.showScoreboard) return '';
      const rows = state.drinkers
        .map((name, i) => {
          const drinks = state.drinkCounts[i] || 0;
          const skips = state.skipCounts[i] || 0;
          const you =
            state.drinkerIndex === i
              ? ' <span style="color:var(--accent)">(ikaw)</span>'
              : '';
          return `
          <div class="score-row">
            <span>${escapeHtml(name)}${you}</span>
            <div class="stats">
              <span>🥃 <strong>${drinks}</strong></span>
              <span>⏭️ <strong>${skips}</strong></span>
            </div>
          </div>`;
        })
        .join('');

      return `
        <div class="modal-overlay" id="modal-score">
          <div class="modal-sheet">
            <h2>📊 Scoreboard</h2>
            <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1rem">
              Kabuuang inom at skip ng session
            </p>
            ${rows}
            <button type="button" class="btn btn-ghost" id="btn-close-score" style="margin-top:1rem">Isara</button>
          </div>
        </div>`;
    }

    function renderTracker() {
      const total = state.drinkers.length;
      const done = state.drunkThisRound.length;
      const radius = 38;

      const slots = state.drinkers
        .map((name, i) => {
          const angle = (i / total) * 360 - 90;
          const rad = (angle * Math.PI) / 180;
          const x = 50 + radius * Math.cos(rad);
          const y = 50 + radius * Math.sin(rad);
          const isActive = i === state.currentIndex && !state.celebrating;
          const isDone = state.drunkThisRound.includes(i);
          const isSkipped = state.skippedThisRound.includes(i);
          const isYou = state.drinkerIndex === i;
          const skips = state.skipCounts[i] || 0;

          let icon = '';
          if (isActive) icon = '🥃';
          else if (isDone) icon = '✓';
          else if (isSkipped) icon = '⏭️';

          const classes = [
            'bubble-slot',
            isActive ? 'active' : '',
            isDone ? 'done' : '',
            isSkipped && !isDone ? 'skipped-round' : '',
            isYou ? 'you' : '',
          ]
            .filter(Boolean)
            .join(' ');

          const skipBadge =
            skips > 0
              ? `<span class="skip-badge">skip x${skips}</span>`
              : '';

          return `
            <div class="${classes}" style="left:${x}%;top:${y}%">
              <div class="bubble">
                <span class="bubble-icon">${icon}</span>
                <span class="bubble-name">${escapeHtml(name)}</span>
              </div>
              ${skipBadge}
            </div>`;
        })
        .join('');

      let centerActions = '';
      if (isMyTurn()) {
        centerActions = `
          <button type="button" class="btn btn-shot" id="btn-shot">Ininom ko na! 🥃</button>
          <button type="button" class="btn btn-skip" id="btn-skip">Preskong muna ⏭️</button>`;
      } else if (state.role === 'host' && canSkip()) {
        centerActions = `
          <div class="center-wait">
            Turno ni <strong>${escapeHtml(currentDrinkerName())}</strong>
          </div>
          <button type="button" class="btn btn-skip" id="btn-skip">Preskong muna ⏭️</button>`;
      } else {
        const msg = state.celebrating
          ? 'Next round na...'
          : `Hintay — si ${escapeHtml(currentDrinkerName())}`;
        centerActions = `<div class="center-wait">${escapeHtml(msg)}</div>`;
      }

      const hostEdit =
        state.role === 'host'
          ? `
        <section class="host-edit">
          <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.5rem">Host: dagdag/alis (hindi ang sarili mo)</p>
          <div class="add-row">
            <input type="text" id="host-add-input" placeholder="Magdagdag..." maxlength="32" />
            <button type="button" class="btn btn-accent" id="btn-host-add" style="width:auto">Add</button>
          </div>
          <div class="chip-list">
            ${state.drinkers
              .map((name, i) => {
                if (i === 0) {
                  return `<span class="chip host-chip">${escapeHtml(name)} (ikaw)</span>`;
                }
                return `
              <span class="chip" data-index="${i}">
                ${escapeHtml(name)}
                <button type="button" class="chip-remove" ${state.drinkers.length <= 2 ? 'disabled' : ''}>✕</button>
              </span>`;
              })
              .join('')}
          </div>
        </section>`
          : '';

      const celebration = state.celebrating
        ? `<div class="celebration">
            <div class="confetti-layer">${buildConfettiHtml()}</div>
            <div class="celebration-box">
              <h2>Lahat tapos na round! 🎉</h2>
              <p style="color:var(--text-muted)">Next round na...</p>
            </div>
          </div>`
        : '';

      return `
        <div class="tracker-screen">
          <div class="room-code-banner">
            <div class="label">Room code</div>
            <div class="code">${escapeHtml(state.code || '')}</div>
            ${state.role === 'host' ? '<span class="role-badge">Host · kasama sa bilog</span>' : '<span class="role-badge">Player</span>'}
          </div>
          <p class="conn-status ${state.connected ? '' : 'offline'}">
            ${state.connected ? '● Live' : 'Nagre-reconnect...'}
          </p>
          <p class="round-bar-promo">
            🍺 <span class="hl">Round ${state.round}</span> · ${done}/${total} nakainom na
          </p>
          <div class="tracker-toolbar">
            <button type="button" class="btn btn-ghost" id="btn-scoreboard">📊 Scoreboard</button>
          </div>
          <div class="circle-stage">
            <div class="circle-guide"></div>
            ${slots}
            <div class="center-zone">${centerActions}</div>
          </div>
          ${celebration}
          ${hostEdit}
          <footer class="tracker-footer">
            ${
              state.role === 'host'
                ? `<button type="button" class="btn btn-danger" id="btn-end">Tapusin ang inuman</button>
                   <button type="button" class="btn btn-ghost" id="btn-leave-host">Umalis</button>`
                : `<button type="button" class="btn btn-ghost" id="btn-leave-player">Umalis sa room</button>`
            }
          </footer>
        </div>
        ${renderScoreboardModal()}`;
    }

    function renderEnded() {
      return `
        <div class="ended-screen">
          <div class="ended-box">
            <h2>Tapos na ang inuman 👋</h2>
            <p style="color:var(--text-muted);margin-top:0.5rem">Salamat sa pag-inom responsibly!</p>
          </div>
          <footer class="setup-footer" style="width:100%">
            <button type="button" class="btn btn-accent" id="btn-home-ended">Bumalik sa home</button>
          </footer>
        </div>`;
    }

    function bindHome() {
      $('#btn-host')?.addEventListener('click', () => {
        state.screen = 'setup';
        state.joinError = '';
        render();
      });
      $('#btn-join-nav')?.addEventListener('click', () => {
        state.screen = 'join';
        state.joinError = '';
        state.joinCode = '';
        state.joinPlayerName = '';
        state.peekDrinkers = [];
        state.peekTaken = [];
        render();
      });
    }

    function bindSetup() {
      $('#host-name-input')?.addEventListener('input', (e) => {
        state.hostName = e.target.value;
      });

      const input = $('#name-input');
      const add = () => {
        const name = normalizeName(input?.value || '');
        if (!name) {
          state.setupError = 'Maglagay ng pangalan.';
          render();
          return;
        }
        if (!normalizeName(state.hostName)) {
          state.setupError = 'Ilagay muna ang pangalan mo.';
          render();
          return;
        }
        if (isDuplicateOther(name)) {
          state.setupError = 'May ganyan na sa listahan.';
          render();
          return;
        }
        state.setupError = '';
        state.otherDrinkers.push(name);
        input.value = '';
        render();
        input?.focus();
      };

      $('#btn-add')?.addEventListener('click', add);
      input?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') add();
      });

      $('#btn-start')?.addEventListener('click', () => {
        const host = normalizeName(state.hostName);
        if (!host || state.otherDrinkers.length < 1) return;
        socket.emit(
          'room:create',
          { hostName: host, drinkers: state.otherDrinkers },
          (res) => {
            if (!res?.ok) {
              state.setupError = res?.error || 'Hindi masimulan ang room.';
              render();
              return;
            }
            state.role = 'host';
            state.drinkerIndex = 0;
            applyServerState(res.state);
            saveSession();
          }
        );
      });

      document.querySelectorAll('.chip-remove').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const chip = e.target.closest('.chip');
          const index = Number(chip?.dataset.index);
          if (!Number.isNaN(index)) {
            state.otherDrinkers.splice(index, 1);
            state.setupError = '';
            render();
          }
        });
      });

      $('#btn-back-home')?.addEventListener('click', goHome);
    }

    function bindJoin() {
      $('#join-code')?.addEventListener('input', (e) => {
        state.joinCode = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
        e.target.value = state.joinCode;
      });

      $('#join-name')?.addEventListener('input', (e) => {
        state.joinPlayerName = e.target.value;
        render();
      });

      $('#btn-peek')?.addEventListener('click', () => {
        state.joinError = '';
        socket.emit('room:peek', { code: state.joinCode }, (res) => {
          if (!res?.ok) {
            state.joinError = res?.error || 'Hindi mahanap ang room.';
            state.peekDrinkers = [];
            render();
            return;
          }
          state.peekDrinkers = res.drinkers;
          state.peekTaken = res.takenIndices || [];
          render();
        });
      });

      $('#btn-join-confirm')?.addEventListener('click', () => {
        const idx = findJoinMatch();
        socket.emit(
          'room:join',
          {
            code: state.joinCode,
            playerName: state.joinPlayerName,
            drinkerIndex: idx,
          },
          (res) => {
            if (!res?.ok) {
              state.joinError = res?.error || 'Hindi makasali.';
              render();
              return;
            }
            state.role = 'player';
            state.drinkerIndex = res.drinkerIndex;
            state.joinError = '';
            applyServerState(res.state);
            saveSession();
          }
        );
      });

      $('#btn-back-home')?.addEventListener('click', goHome);
    }

    function bindTracker() {
      $('#btn-shot')?.addEventListener('click', () => {
        socket.emit('shot:mark', {}, () => {});
      });

      $('#btn-skip')?.addEventListener('click', () => {
        socket.emit('shot:skip', {}, () => {});
      });

      $('#btn-scoreboard')?.addEventListener('click', () => {
        state.showScoreboard = true;
        render();
      });

      $('#btn-close-score')?.addEventListener('click', () => {
        state.showScoreboard = false;
        render();
      });

      $('#modal-score')?.addEventListener('click', (e) => {
        if (e.target.id === 'modal-score') {
          state.showScoreboard = false;
          render();
        }
      });

      $('#btn-end')?.addEventListener('click', () => {
        if (!confirm('Tapusin na ang inuman para sa lahat?')) return;
        socket.emit('session:end', {}, () => {
          state.screen = 'ended';
          clearSession();
          render();
        });
      });

      $('#btn-leave-host')?.addEventListener('click', () => {
        if (confirm('Tapusin ang session para sa lahat?')) {
          socket.emit('session:end', {}, goHome);
        }
      });

      $('#btn-leave-player')?.addEventListener('click', goHome);

      if (state.role === 'host') {
        const hostInput = $('#host-add-input');
        $('#btn-host-add')?.addEventListener('click', () => {
          socket.emit('drinkers:add', { name: hostInput?.value }, (res) => {
            if (!res?.ok) state.setupError = res?.error || 'Error';
            else {
              state.setupError = '';
              hostInput.value = '';
            }
            render();
          });
        });

        document.querySelectorAll('.host-edit .chip-remove').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            const index = Number(e.target.closest('.chip')?.dataset.index);
            if (!Number.isNaN(index)) {
              socket.emit('drinkers:remove', { index }, (res) => {
                if (!res?.ok) state.setupError = res?.error || 'Error';
                render();
              });
            }
          });
        });
      }
    }

    function bindEnded() {
      $('#btn-home-ended')?.addEventListener('click', goHome);
    }

    function goHome() {
      clearSession();
      state.screen = 'home';
      state.role = null;
      state.code = null;
      state.drinkerIndex = -1;
      state.hostName = '';
      state.otherDrinkers = [];
      state.drinkers = [];
      state.drunkThisRound = [];
      state.skippedThisRound = [];
      state.celebrating = false;
      state.showScoreboard = false;
      state.peekDrinkers = [];
      state.joinCode = '';
      state.joinPlayerName = '';
      render();
    }

    function render() {
      const app = $('#app');
      let html = '';
      switch (state.screen) {
        case 'setup':
          html = renderSetup();
          break;
        case 'join':
          html = renderJoin();
          break;
        case 'tracker':
          html = renderTracker();
          break;
        case 'ended':
          html = renderEnded();
          break;
        default:
          html = renderHome();
      }
      app.innerHTML = html;

      switch (state.screen) {
        case 'home':
          bindHome();
          break;
        case 'setup':
          bindSetup();
          break;
        case 'join':
          bindJoin();
          break;
        case 'tracker':
          bindTracker();
          break;
        case 'ended':
          bindEnded();
          break;
      }
    }

    render();
  </script>
</body>
</html>
